name: Run database migrations

# Solo manual (Actions → "Run database migrations" → Run workflow). Antes corría en push a
# cualquier rama con cambios en src/migrations/**, lo que aplicaba migraciones de ramas sin
# mergear contra la base de DATABASE_URL.
on:
  workflow_dispatch:
    inputs:
      limpiar_marca_dev_mode:
        description: >-
          Quitar la marca de "dev mode" (la base tuvo cambios empujados por `pnpm dev`). Sin esto,
          si la marca existe el job falla en vez de quedarse esperando el (y/N) de Payload.
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Red de seguridad: si algo vuelve a pedir input interactivo, que no se quede colgado 6 horas.
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      # Las migraciones que suben archivos a Media (p. ej. imágenes de productos) necesitan
      # Vercel Blob: sin token, Payload escribiría al disco del runner y el archivo se perdería.
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm dev` deja una fila con batch = -1 en payload_migrations; con ella, `payload migrate`
      # pregunta (y/N) de forma interactiva — y en esta versión de Payload `migrate` NO acepta
      # --force-accept-warning. Aceptar ese prompt solo ignora la fila, así que borrarla es
      # equivalente. Las migraciones del repo usan IF NOT EXISTS para tolerar columnas que el dev
      # mode ya haya creado.
      - name: Revisar marca de dev mode
        env:
          LIMPIAR: ${{ inputs.limpiar_marca_dev_mode }}
        run: |
          if [ "$(psql "$DATABASE_URL" -tAc "SELECT to_regclass('public.payload_migrations') IS NOT NULL")" != "t" ]; then
            echo "Base sin tabla payload_migrations todavía; nada que revisar."
            exit 0
          fi
          MARCAS=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM payload_migrations WHERE batch = -1")
          if [ "$MARCAS" = "0" ]; then
            echo "Sin marca de dev mode."
          elif [ "$LIMPIAR" = "true" ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM payload_migrations WHERE batch = -1"
            echo "Marca de dev mode eliminada."
          else
            echo "::error::La base tiene marca de dev mode (alguien corrió 'pnpm dev' contra ella). Vuelve a correr el workflow marcando 'limpiar_marca_dev_mode'."
            exit 1
          fi

      - run: pnpm run migrate
