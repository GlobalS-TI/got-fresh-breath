name: Run database migrations

# Solo manual (Actions → "Run database migrations" → Run workflow). Antes corría en push a
# cualquier rama con cambios en src/migrations/**, lo que aplicaba migraciones de ramas sin
# mergear contra la base de DATABASE_URL.
on:
  workflow_dispatch:
    inputs:
      aceptar_advertencia_dev:
        description: >-
          Aceptar la advertencia de "dev mode" (la base tuvo cambios empujados por `pnpm dev`).
          Sin esto, `payload migrate` se queda esperando una respuesta (y/N) que el CI no puede dar.
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --force-accept-warning solo descarta la marca de dev mode y corre las migraciones pendientes;
      # las migraciones del repo están escritas para tolerar columnas que el dev mode ya haya creado.
      - run: pnpm run migrate ${{ inputs.aceptar_advertencia_dev && '--force-accept-warning' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          # Las migraciones que suben archivos a Media (p. ej. imágenes de productos) necesitan
          # Vercel Blob: sin token, Payload escribiría al disco del runner y el archivo se perdería.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
