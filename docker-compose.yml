services:

  payload:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://gfb_user:gfb_password@postgres:5432/gfb_dev
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
     image: postgres:16-alpine
     container_name: gfb-db
     restart: always
     environment:
       POSTGRES_USER: gfb_user
       POSTGRES_PASSWORD: gfb_password
       POSTGRES_DB: gfb_dev
     ports:
       - "5433:5432"
     volumes:
       - gfb_pgdata:/var/lib/postgresql/data
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U gfb_user -d gfb_dev"]
       interval: 5s
       timeout: 5s
       retries: 5

volumes:
  gfb_pgdata:
  node_modules:

